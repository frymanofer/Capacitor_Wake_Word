<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="styles.css">
    <title>Capacitor Wake Word Example</title>
</head>
<body>
    <main class="card">
        <p class="eyebrow">DaVoice.io</p>
        <h1>Capacitor Wake Word</h1>
        <p>This app creates and destroys a native wake word detector through Capacitor's Cordova compatibility layer.</p>
        <p id="status" class="status" role="status">Waiting for Capacitor…</p>
        <p class="settings">Threshold: 0.99 · Buffer count: 2</p>
    </main>
    <script src="cordova.js"></script>
    <script src="app.js"></script>
</body>
</html>
